name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

      - name: Guard production API URL
        run: |
          set -euo pipefail
          if grep -R -q -E '127\.0\.0\.1:8001|localhost:8000' dist/alotrojah/browser --include='*.js'; then
            echo 'LOCAL API URL LEAKED INTO PRODUCTION BUILD' >&2
            exit 1
          fi
          if ! grep -R -q 'api\.alotrojah\.ma' dist/alotrojah/browser --include='*.js'; then
            echo 'PRODUCTION API URL MISSING FROM BUILD' >&2
            exit 1
          fi
          echo 'PRODUCTION API URL OK'

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: zip
          coverage: none

      - name: Build frontend.zip
        run: |
          php deploy_script/Build-Zip.php
          test -f deploy_script/frontend.zip
          ls -lh deploy_script/frontend.zip

      - name: Stamp extractor with deploy token
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_TOKEN:-}" ]; then
            echo "DEPLOY_TOKEN secret is required." >&2
            exit 1
          fi
          sed "s/__DEPLOY_TOKEN__/${DEPLOY_TOKEN}/" deploy_script/deploy.php > deploy_script/deploy.stamped.php
          if grep -q '__DEPLOY_TOKEN__' deploy_script/deploy.stamped.php; then
            echo "token stamp failed" >&2
            exit 1
          fi

      - name: Install lftp (FTPS client)
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Upload zip + extractor via FTPS
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USERNAME }}
          FTP_PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          set -euo pipefail
          printf 'machine %s login %s password %s\n' "$FTP_HOST" "$FTP_USER" "$FTP_PASS" > ~/.netrc
          chmod 600 ~/.netrc
          lftp -e "
            set ftp:ssl-force true;
            set ssl:verify-certificate no;
            set net:max-retries 5;
            set net:timeout 30;
            set net:reconnect-interval-base 5;
            open $FTP_HOST;
            put deploy_script/frontend.zip -o public_html/frontend.zip;
            put deploy_script/deploy.stamped.php -o public_html/deploy.php;
            bye"
          rm -f ~/.netrc deploy_script/deploy.stamped.php

      - name: Trigger server-side extract
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
          DEPLOY_URL: ${{ secrets.FRONTEND_DEPLOY_URL }}
        run: |
          set -euo pipefail
          URL="${DEPLOY_URL:-https://alotrojah.ma/deploy.php?action=extract}"
          case "$URL" in
            *\?*) SEP='&' ;;
            *) SEP='?' ;;
          esac
          URL="${URL}${SEP}cb=${GITHUB_RUN_ID:-local}-${GITHUB_RUN_ATTEMPT:-1}-$(date +%s)"
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36'

          HTTP=$(curl -sS --max-time 590 -o deploy.log -w '%{http_code}' \
            -A "$UA" \
            -H 'Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8' \
            -H 'Accept-Language: en-US,en;q=0.9' \
            -H 'Cache-Control: no-cache' \
            -H 'Pragma: no-cache' \
            -H 'Sec-Fetch-Site: none' \
            -H 'Sec-Fetch-Mode: navigate' \
            -H 'Sec-Fetch-User: ?1' \
            -H 'Sec-Fetch-Dest: document' \
            -H 'Upgrade-Insecure-Requests: 1' \
            -H 'sec-ch-ua: "Chromium";v="126", "Google Chrome";v="126", "Not-A.Brand";v="99"' \
            -H 'sec-ch-ua-mobile: ?0' \
            -H 'sec-ch-ua-platform: "Windows"' \
            -H "X-Deploy-Token: ${DEPLOY_TOKEN}" \
            "$URL")
          echo "deploy HTTP ${HTTP}"
          head -c 1200 deploy.log; echo

          if grep -qi 'Please wait while your request is being verified\|imunify-bot-check' deploy.log; then
            echo 'Imunify360/Cloudflare bot verification intercepted the deploy request.' >&2
            echo 'Whitelist the deploy path (or GitHub runner egress) at the origin/WAF, or set FRONTEND_DEPLOY_URL to an allowlisted trigger.' >&2
            exit 1
          fi
          if [ "$HTTP" != "200" ]; then
            echo "Deploy trigger returned HTTP ${HTTP}." >&2
            exit 1
          fi
          grep -q '"ok":true' deploy.log

      - name: Keep deploy log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-deploy-log
          path: deploy.log
          if-no-files-found: ignore

      - name: Verify production
        env:
          UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
        run: |
          set -e
          code=$(curl -s -A "$UA" -o /dev/null -w '%{http_code}' https://alotrojah.ma/); test "$code" = "200"
          curl -s -A "$UA" https://alotrojah.ma/assets/i18n/ar.json | grep -q '"app"'
          code=$(curl -s -A "$UA" -o /dev/null -w '%{http_code}' https://alotrojah.ma/students); test "$code" = "200"
          html=$(curl -sL -A "$UA" https://alotrojah.ma/)
          echo "HTML bytes: ${#html}"
          mkdir -p /tmp/bundles && rm -f /tmp/bundles/*.js
          for f in $(printf '%s' "$html" | grep -o '[A-Za-z0-9_.-]*\.js' | sort -u); do
            code=$(curl -s -A "$UA" -o "/tmp/bundles/$f" -w '%{http_code}' "https://alotrojah.ma/$f")
            echo "$f -> $code"
            test "$code" = "200"
          done
          if ! grep -q 'api.alotrojah.ma' /tmp/bundles/*.js; then
            echo 'PRODUCTION API URL MISSING FROM DEPLOYED BUNDLES' >&2
            exit 1
          fi
          if grep -q -E 'localhost:8000|127\.0\.0\.1:8001' /tmp/bundles/*.js; then
            echo 'LOCAL API URL LEAKED INTO PROD' >&2
            exit 1
          fi
          echo 'PROD VERIFIED'
