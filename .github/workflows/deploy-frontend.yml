name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: FTP deploy to public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/alotrojah/browser/
          server-dir: public_html/
          dangerous-clean-slate: false

      - name: Verify production
        env:
          UA: 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36'
        run: |
          set -e
          code=$(curl -s -A "$UA" -o /dev/null -w '%{http_code}' https://alotrojah.ma/); test "$code" = "200"
          curl -s -A "$UA" https://alotrojah.ma/assets/i18n/ar.json | grep -q '"app"'
          code=$(curl -s -A "$UA" -o /dev/null -w '%{http_code}' https://alotrojah.ma/students); test "$code" = "200"
          html=$(curl -sL -A "$UA" https://alotrojah.ma/)
          echo "HTML bytes: ${#html}"
          mkdir -p /tmp/bundles && rm -f /tmp/bundles/*.js
          for f in $(printf '%s' "$html" | grep -o '[A-Za-z0-9_.-]*\.js' | sort -u); do
            code=$(curl -s -A "$UA" -o "/tmp/bundles/$f" -w '%{http_code}' "https://alotrojah.ma/$f")
            echo "$f -> $code"
            test "$code" = "200"
          done
          grep -q 'api.alotrojah.ma' /tmp/bundles/*.js
          if grep -q 'localhost:8000' /tmp/bundles/*.js; then echo 'DEV URL LEAKED INTO PROD'; exit 1; fi
          echo 'PROD VERIFIED'
