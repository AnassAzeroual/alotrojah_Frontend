name: Deploy Frontend

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
      - run: npm run build

  deploy:
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: FTP deploy to public_html/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: dist/alotrojah/browser/
          server-dir: public_html/
          dangerous-clean-slate: false

      - name: Verify production
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' https://alotrojah.ma/); test "$code" = "200"
          curl -s https://alotrojah.ma/assets/i18n/ar.json | grep -q '"app"'
          code=$(curl -s -o /dev/null -w '%{http_code}' https://alotrojah.ma/students); test "$code" = "200"
          html=$(curl -sL https://alotrojah.ma/)
          echo "HTML bytes: ${#html}"
          js=$(printf '%s' "$html" | grep -o 'main\.[A-Za-z0-9_-]*\.js' | head -1)
          echo "JS bundle: [$js]"
          test -n "$js"
          bcode=$(curl -s -o /tmp/bundle.js -w '%{http_code}' "https://alotrojah.ma/$js")
          echo "bundle http: $bcode"; test "$bcode" = "200"
          grep -q 'api.alotrojah.ma' /tmp/bundle.js
          if grep -q 'localhost:8000' /tmp/bundle.js; then echo 'DEV URL LEAKED INTO PROD'; exit 1; fi
          echo 'PROD VERIFIED'
