<section class="page">
  <div class="page-head anim-rise">
    <h1>{{ 'exam.new' | translate }}</h1>
  </div>

  <div class="card anim-rise" style="--i: 1">
    <label class="field search"
      ><span>{{ 'planning.pick_student' | translate }}</span>
      <input
        type="search"
        data-testid="exam-student-search"
        [value]="search()"
        (change)="search.set($any($event.target).value)"
        [placeholder]="'list.search' | translate"
      />
    </label>
    <div class="cluster">
      @for (s of found.value() ?? []; track s.id) {
        <button
          type="button"
          class="pick"
          [class.on]="pickedStudent() === s.id"
          (click)="pickedStudent.set(s.id)"
        >
          {{ s.full_name }}
        </button>
      }
    </div>
  </div>

  <form class="card anim-rise" style="--i: 2" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field"
      ><span>{{ 'exam.type' | translate }}</span>
      <app-dropdown
        formControlName="exam_type"
        [options]="examTypeOptions"
        ariaLabelKey="exam.type"
        testId="exam-type"
      />
    </label>
    @if (form.controls.exam_type.value !== 'final_season') {
      <label class="field"
        ><span>{{ 'planning.pick_term' | translate }}</span>
        <app-dropdown
          [formControl]="form.controls.term_id"
          [options]="termOptions()"
          ariaLabelKey="planning.pick_term"
          testId="exam-term"
        />
      </label>
    }
    <label class="field"
      ><span>{{ 'exam.date' | translate }}</span
      ><input type="date" formControlName="exam_date" data-testid="exam-date"
    /></label>

    <button
      type="submit"
      class="btn btn-primary btn-block"
      data-testid="exam-submit"
      [class.is-loading]="saving()"
      [disabled]="pickedStudent() === null || saving()"
    >
      @if (saving()) {
        <app-spinner />
      } @else {
        {{ 'common.save' | translate }}
      }
    </button>
    @if (errorKey()) {
      <div class="banner danger">{{ errorKey()! | translate }}</div>
    }
  </form>
</section>
