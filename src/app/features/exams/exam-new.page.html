<section class="page">
  <div class="page-head anim-rise">
    <h1>{{ 'exam.new' | translate }}</h1>
  </div>

  <div class="card anim-rise" style="--i: 1">
    <label class="field">
      <span>{{ 'list.group' | translate }}</span>
      <app-dropdown
        [options]="groupOptions()"
        [value]="groupId() ?? ''"
        (valueChange)="onGroupPick($event)"
        placeholderKey="list.group"
        ariaLabelKey="list.group"
        testId="exam-group"
      />
    </label>
    <label class="field">
      <span>{{ 'planning.pick_student' | translate }} <span class="danger">*</span></span>
      <app-dropdown
        [options]="pupilOptions()"
        [value]="pickedStudent() ?? ''"
        (valueChange)="onPupilPick($event)"
        placeholderKey="planning.pick_student"
        ariaLabelKey="planning.pick_student"
        testId="exam-student"
      />
    </label>
  </div>

  <form
    class="card anim-rise"
    style="--i: 2"
    [formGroup]="form"
    (ngSubmit)="submit()"
    autocomplete="off"
  >
    <label class="field"
      ><span>{{ 'exam.type' | translate }}</span>
      <app-dropdown
        formControlName="exam_type"
        [options]="examTypeOptions"
        ariaLabelKey="exam.type"
        testId="exam-type"
      />
    </label>
    @if (form.controls.exam_type.value !== 'final_season') {
      <label class="field"
        ><span>{{ 'planning.pick_term' | translate }}</span>
        <app-dropdown
          [formControl]="form.controls.term_id"
          [options]="termOptions()"
          ariaLabelKey="planning.pick_term"
          testId="exam-term"
        />
      </label>
    }
    <label class="field"
      ><span>{{ 'exam.date' | translate }}</span
      ><app-date-picker formControlName="exam_date" testId="exam-date" ariaLabelKey="exam.date"
    /></label>

    <button
      type="submit"
      class="btn btn-primary btn-block"
      data-testid="exam-submit"
      [class.is-loading]="saving()"
      [disabled]="pickedStudent() === null || saving()"
    >
      @if (saving()) {
        <app-spinner />
      } @else {
        {{ 'common.save' | translate }}
      }
    </button>
    @if (blockers().length > 0 && !saving()) {
      <p class="muted" data-testid="exam-blockers">
        @for (b of blockers(); track b) {
          <span>{{ b | translate }}</span>
          @if (!$last) {
            <br />
          }
        }
      </p>
    }
  </form>
</section>
