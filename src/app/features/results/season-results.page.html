<section class="page">
  <div class="page-head anim-rise">
    <h1>{{ 'result.season_title' | translate }}</h1>
  </div>

  <div class="card anim-rise" style="--i: 1">
    <label class="field search"
      ><span>{{ 'planning.pick_student' | translate }}</span>
      <input
        type="search"
        [value]="search()"
        (change)="search.set($any($event.target).value)"
        [placeholder]="'list.search' | translate"
      />
    </label>
    <div class="cluster">
      @for (s of found.value() ?? []; track s.id) {
        <button
          type="button"
          class="pick"
          [class.on]="pickedStudent() === s.id"
          (click)="pickedStudent.set(s.id)"
        >
          {{ s.full_name }}
        </button>
      }
    </div>
    @if (existing.value()) {
      <div class="cluster">
        <button type="button" class="btn btn-ghost" (click)="fill()">
          {{ 'planning.load_existing' | translate }}
        </button>
        <app-status-badge kind="honor" [value]="existing.value()!.honor_flag" />
      </div>
    }
  </div>

  @if (pickedStudent() !== null) {
    <form class="card anim-rise" style="--i: 2" [formGroup]="form" (ngSubmit)="submit()">
      <label class="field"
        ><span>{{ 'result.memorized_label' | translate }}</span
        ><input formControlName="total_memorized_label"
      /></label>
      <label class="field"
        ><span>{{ 'result.overall' | translate }}</span>
        <input
          type="number"
          class="ltr-num"
          formControlName="overall_avg"
          min="0"
          max="20"
          step="0.5"
        />
      </label>
      <label class="field"
        ><span>{{ 'result.board' | translate }}</span
        ><input formControlName="board_report"
      /></label>
      <label class="field"
        ><span>{{ 'result.honor' | translate }}</span>
        <app-dropdown
          formControlName="honor_flag"
          [options]="honorOptions"
          ariaLabelKey="result.honor"
        />
      </label>
      <button
        type="submit"
        class="btn btn-primary btn-block"
        [class.is-loading]="saving()"
        [disabled]="saving()"
      >
        @if (saving()) {
          <app-spinner />
        } @else {
          {{ 'common.save' | translate }}
        }
      </button>
    </form>
  }
</section>
