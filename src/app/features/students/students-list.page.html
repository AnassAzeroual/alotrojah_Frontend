<section class="list">
  <h1>{{ 'nav.students' | translate }}</h1>

  <div class="filters card">
    <input
      type="search"
      [placeholder]="'list.search' | translate"
      [value]="q()"
      (change)="q.set($any($event.target).value); resetPage()"
    />
    <select
      [value]="groupId() ?? ''"
      (change)="groupId.set(num($any($event.target).value)); resetPage()"
    >
      <option value="">{{ 'list.group' | translate }}: {{ 'list.all' | translate }}</option>
      @for (g of groups(); track g.id) {
        <option [value]="g.id">{{ g.name }}</option>
      }
    </select>
    <select
      [value]="levelId() ?? ''"
      (change)="levelId.set(num($any($event.target).value)); resetPage()"
    >
      <option value="">{{ 'list.level' | translate }}: {{ 'list.all' | translate }}</option>
      @for (l of levels(); track l.id) {
        <option [value]="l.id">{{ l.name_ar }}</option>
      }
    </select>
    <select
      [value]="status() ?? ''"
      (change)="status.set($any($event.target).value || null); resetPage()"
    >
      <option value="">{{ 'list.status' | translate }}: {{ 'list.all' | translate }}</option>
      @for (s of statuses; track s) {
        <option [value]="s">{{ 'studentStatus.' + s | translate }}</option>
      }
    </select>
    <select
      [value]="mode() ?? ''"
      (change)="mode.set($any($event.target).value || null); resetPage()"
    >
      <option value="">{{ 'list.mode' | translate }}: {{ 'list.all' | translate }}</option>
      @for (m of modes; track m) {
        <option [value]="m">{{ 'mode.' + m | translate }}</option>
      }
    </select>
  </div>

  @if (loading()) {
    <app-spinner />
  } @else if (rows().length === 0) {
    <app-empty-state />
  } @else {
    <div class="rows">
      @for (s of rows(); track s.id) {
        <a class="card row" [routerLink]="['/students', s.id]">
          <strong>{{ s.full_name }}</strong>
          <small class="muted"
            >{{ s.group?.name ?? '—' }} · {{ 'mode.' + s.memorization_mode | translate }}</small
          >
        </a>
      }
    </div>
    <app-paginator [page]="page()" [total]="total()" (pageChange)="page.set($event)" />
  }
</section>
