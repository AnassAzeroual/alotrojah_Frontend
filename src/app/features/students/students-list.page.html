<section class="page">
  <div class="page-head anim-rise">
    <h1>{{ 'nav.students' | translate }}</h1>
    <a routerLink="/students/new" class="btn btn-primary">
      {{ 'students.create' | translate }}
    </a>
  </div>

  <div class="toolbar card anim-rise" style="--i: 1">
    <label class="field search grow">
      <span class="sr-only">{{ 'list.search' | translate }}</span>
      <input
        type="search"
        [placeholder]="'list.search' | translate"
        [value]="q()"
        (change)="q.set($any($event.target).value); resetPage()"
      />
    </label>
    <label class="field">
      <app-dropdown
        [options]="groupOptions()"
        [value]="txt(groupId())"
        (valueChange)="groupId.set(num($event)); resetPage()"
        ariaLabelKey="list.group"
      />
    </label>
    <label class="field">
      <app-dropdown
        [options]="levelOptions()"
        [value]="txt(levelId())"
        (valueChange)="levelId.set(num($event)); resetPage()"
        ariaLabelKey="list.level"
      />
    </label>
    <label class="field">
      <app-dropdown
        [options]="statusOptions()"
        [value]="status() ?? ''"
        (valueChange)="status.set(txt($event) || null); resetPage()"
        ariaLabelKey="list.status"
      />
    </label>
    <label class="field">
      <app-dropdown
        [options]="modeOptions()"
        [value]="mode() ?? ''"
        (valueChange)="mode.set(txt($event) || null); resetPage()"
        ariaLabelKey="list.mode"
      />
    </label>
  </div>

  @if (loading()) {
    <div class="stack" aria-hidden="true">
      <div class="skeleton sk-card"></div>
      <div class="skeleton sk-card"></div>
      <div class="skeleton sk-card"></div>
    </div>
  } @else if (rows().length === 0) {
    <app-empty-state />
  } @else {
    <div class="grid-auto">
      @for (s of rows(); track s.id) {
        <a class="card anim-rise" [style.--i]="$index" [routerLink]="['/students', s.id]">
          <span class="row-top">
            <span class="avatar-sm" aria-hidden="true">{{ s.full_name.slice(0, 1) }}</span>
            <strong>{{ s.full_name }}</strong>
          </span>
          <small class="muted"
            >{{ s.group?.name ?? '—' }} · {{ 'mode.' + s.memorization_mode | translate }}</small
          >
        </a>
      }
    </div>
    <app-paginator [page]="page()" [total]="total()" (pageChange)="page.set($event)" />
  }
</section>
