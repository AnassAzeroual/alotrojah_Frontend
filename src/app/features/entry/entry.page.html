<section class="page">
  <div class="page-head anim-rise">
    <h1>{{ 'entry.title' | translate }}</h1>
  </div>

  <div class="toolbar card anim-rise" style="--i: 1">
    <label class="field">
      <span>{{ 'entry.pick_group' | translate }}</span>
      <app-dropdown
        [options]="groupOptions()"
        [value]="txt(selectedGroup())"
        (valueChange)="onGroup(num($event))"
        ariaLabelKey="entry.pick_group"
      />
    </label>

    <label class="field">
      <span>{{ 'entry.pick_week' | translate }}</span>
      <app-dropdown
        [options]="weekOptions()"
        [value]="txt(selectedWeek())"
        (valueChange)="onWeek(num($event))"
        ariaLabelKey="entry.pick_week"
      />
    </label>

    <label class="field">
      <span>{{ 'entry.pick_session' | translate }}</span>
      <app-dropdown
        [options]="sessionOptions()"
        [value]="txt(selectedSession())"
        (valueChange)="selectedSession.set(num($event))"
        ariaLabelKey="entry.pick_session"
      />
    </label>
  </div>

  @if (ready()) {
    @if (existing.isLoading()) {
      <div class="card anim-fade" aria-hidden="true">
        <div class="skeleton sk-title"></div>
        <div class="skeleton sk-card"></div>
        <div class="skeleton sk-card"></div>
      </div>
    } @else {
      <app-attendance-grid
        [students]="students.value() ?? []"
        [existing]="attendanceRows()"
        [sessionId]="selectedSession()"
        (saved)="onSaved()"
      />
      <app-score-sheet
        [students]="students.value() ?? []"
        [modules]="modules()"
        [scoreRows]="scoreRows()"
        [sessionId]="selectedSession()"
        [disabledAll]="isMurajaa()"
        (saved)="onSaved()"
      />
      <app-goal-list [students]="students.value() ?? []" [weekId]="selectedWeek()" />
    }
  } @else {
    <app-empty-state messageKey="entry.pick_hint" />
  }
</section>
