<section class="card anim-rise" style="--i: 4">
  <h2>{{ 'entry.goal' | translate }}</h2>

  @for (row of rows(); track row.student.id) {
    <form class="line anim-rise" [style.--i]="$index + 5" (ngSubmit)="save(row)" autocomplete="off">
      <span class="name">{{ row.student.full_name }}</span>
      <label class="field">
        <span class="sr-only">{{ row.student.full_name }}</span>
        <input
          type="text"
          [value]="row.target"
          [placeholder]="'entry.target_hint' | translate"
          (input)="edit(row.student.id, { target: trackInput($event) })"
        />
      </label>
      <div class="cluster">
        <label class="chk">
          <input
            type="checkbox"
            [checked]="row.done"
            (change)="edit(row.student.id, { done: trackCheck($event) })"
          />
          {{ 'entry.done' | translate }}
        </label>
        <button type="submit" class="btn btn-ghost" [disabled]="row.saving" (click)="save(row)">
          @if (row.saving) {
            <app-spinner />
          } @else {
            {{ 'common.save' | translate }}
          }
        </button>
      </div>
    </form>
  }
</section>
