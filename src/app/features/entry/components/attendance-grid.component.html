<section class="card anim-rise" style="--i: 2">
  <h2>{{ 'entry.attendance' | translate }}</h2>

  @for (row of rows(); track row.student.id) {
    <div class="line anim-rise" [style.--i]="$index + 3">
      <span class="name">{{ row.student.full_name }}</span>
      <div class="segmented" role="group">
        @for (st of ['present', 'late', 'absent', 'excused']; track st) {
          <button
            type="button"
            [class.on]="row.status === st"
            [attr.data-state]="st"
            (click)="setStatus(row.student.id, $any(st))"
          >
            {{ 'attendance.' + st | translate }}
          </button>
        }
      </div>
    </div>
  }

  <button
    type="button"
    class="btn btn-primary btn-block save"
    [class.is-loading]="saving()"
    [disabled]="!dirty() || saving()"
    (click)="save()"
  >
    @if (saving()) {
      <app-spinner />
    } @else {
      {{ 'entry.save_attendance' | translate }}
    }
  </button>
</section>
