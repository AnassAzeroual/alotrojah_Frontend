@if (term.isLoading()) {
  <app-spinner />
} @else if (!term.value()) {
  <app-empty-state />
} @else {
  <section>
    <h1>{{ term.value()!.name_ar }}</h1>

    @for (w of term.value()!.weeks ?? []; track w.id) {
      <div class="card week">
        <button type="button" class="whead" (click)="toggleWeek(w.id)">
          <strong>{{ 'common.week' | translate }} {{ w.week_number_global }}</strong>
          <app-status-badge kind="week" [value]="w.week_type" />
        </button>

        <div class="wtype">
          <button type="button" [disabled]="w.week_type === 'study'" (click)="setWeekType(w.id, 'study')">
            {{ 'weekType.study' | translate }}
          </button>
          <button type="button" [disabled]="w.week_type === 'review'" (click)="setWeekType(w.id, 'review')">
            {{ 'weekType.review' | translate }}
          </button>
        </div>

        @if (openWeek() === w.id) {
          @for (s of w.sessions ?? []; track s.id) {
            <div class="sess">
              <span class="ltr-num">#{{ s.session_number_global }}</span>
              <select [value]="s.session_type" (change)="setSession(s.id, { session_type: sessVal($event) })">
                <option value="memorization">{{ 'sessionType.memorization' | translate }}</option>
                <option value="revision">{{ 'sessionType.revision' | translate }}</option>
                <option value="exam">{{ 'sessionType.exam' | translate }}</option>
              </select>
              <select [value]="s.status" (change)="setSession(s.id, { status: sessVal($event) })">
                <option value="planned">{{ 'sessionStatus.planned' | translate }}</option>
                <option value="done">{{ 'sessionStatus.done' | translate }}</option>
                <option value="cancelled">{{ 'sessionStatus.cancelled' | translate }}</option>
              </select>
              <input type="date" [value]="s.planned_date ?? ''" (change)="setSession(s.id, { planned_date: sessVal($event) })" />
            </div>
          }
        }
      </div>
    }
  </section>
}
