@if (term.isLoading()) {
  <div class="page stack" aria-hidden="true">
    <div class="skeleton sk-title"></div>
    <div class="skeleton sk-card"></div>
    <div class="skeleton sk-card"></div>
  </div>
} @else if (!term.value()) {
  <app-empty-state />
} @else {
  <section class="page">
    <div class="page-head anim-rise">
      <h1>{{ term.value()!.name_ar }}</h1>
    </div>

    @for (w of term.value()!.weeks; track w.id) {
      <div class="card week anim-rise" [style.--i]="$index">
        <button type="button" class="whead" (click)="toggleWeek(w.id)">
          <strong>{{ 'common.week' | translate }} {{ w.week_number_global }}</strong>
          <app-status-badge kind="week" [value]="w.week_type" />
        </button>

        <div class="segmented" role="group">
          <button
            type="button"
            [class.on]="w.week_type === 'study'"
            [disabled]="w.week_type === 'study'"
            (click)="setWeekType(w.id, 'study')"
          >
            {{ 'weekType.study' | translate }}
          </button>
          <button
            type="button"
            [class.on]="w.week_type === 'review'"
            [disabled]="w.week_type === 'review'"
            (click)="setWeekType(w.id, 'review')"
          >
            {{ 'weekType.review' | translate }}
          </button>
        </div>

        @if (openWeek() === w.id) {
          @for (s of w.sessions ?? []; track s.id) {
            <div class="sess anim-fade">
              <span class="ltr-num">#{{ s.session_number_global }}</span>
              <app-dropdown
                [options]="sessionTypeOptions"
                [value]="s.session_type"
                (valueChange)="setSession(s.id, { session_type: txt($event) })"
                ariaLabelKey="sessionType.memorization"
              />
              <app-dropdown
                [options]="sessionStatusOptions"
                [value]="s.status"
                (valueChange)="setSession(s.id, { status: txt($event) })"
                ariaLabelKey="sessionStatus.planned"
              />
              <input
                type="date"
                [value]="s.planned_date ?? ''"
                (change)="setSession(s.id, { planned_date: sessVal($event) })"
              />
            </div>
          }
        }
      </div>
    }
  </section>
}
