<section class="page">
  <div class="page-head anim-rise">
    <h1>{{ 'planning.new_season' | translate }}</h1>
  </div>

  <section class="card anim-rise" style="--i: 1">
    <form [formGroup]="form" (ngSubmit)="submit()" class="stack">
      <label class="field"
        ><span>{{ 'planning.name' | translate }}</span
        ><input formControlName="name"
      /></label>
      <label class="field"
        ><span>{{ 'planning.start_date' | translate }}</span
        ><input type="date" formControlName="start_date"
      /></label>
      <label class="field"
        ><span>{{ 'planning.hijri' | translate }}</span
        ><input formControlName="hijri_year"
      /></label>
      <label class="field"
        ><span>{{ 'planning.sessions_per_week' | translate }}</span>
        <input type="number" class="ltr-num" formControlName="sessions_per_week" min="1" max="7" />
      </label>
      <label class="field"
        ><span>{{ 'planning.review_weeks' | translate }}</span>
        <input
          type="number"
          class="ltr-num"
          formControlName="review_weeks_per_term"
          min="0"
          max="3"
        />
      </label>

      <h2>{{ 'planning.terms' | translate }}</h2>
      <div formArrayName="terms" class="stack">
        @for (row of form.controls.terms.controls; track $index) {
          <div class="term-row anim-rise" [style.--i]="$index + 2" [formGroupName]="$index">
            <input formControlName="name" [placeholder]="'planning.name' | translate" />
            <input type="number" formControlName="weeks" min="1" max="12" class="ltr-num" />
            <button
              type="button"
              class="btn btn-danger-ghost"
              [attr.aria-label]="'common.delete' | translate"
              (click)="removeTerm($index)"
            >
              {{ 'common.delete' | translate }}
            </button>
          </div>
        }
      </div>
      <button type="button" class="btn btn-ghost" (click)="addTerm()">
        + {{ 'planning.terms' | translate }}
      </button>

      @if (error()) {
        <p class="field-error">{{ error() }}</p>
      }

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [class.is-loading]="saving()"
        [disabled]="form.invalid || saving()"
      >
        @if (saving()) {
          <app-spinner />
        } @else {
          {{ 'planning.create' | translate }}
        }
      </button>
    </form>
  </section>
</section>
