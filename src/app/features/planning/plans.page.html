<section class="page">
  <div class="page-head anim-rise">
    <h1>{{ 'planning.plans_title' | translate }}</h1>
  </div>

  <div class="card anim-rise" style="--i: 1">
    <label class="field search"
      ><span>{{ 'planning.pick_student' | translate }}</span>
      <input
        type="search"
        [value]="search()"
        (change)="search.set($any($event.target).value)"
        [placeholder]="'list.search' | translate"
      />
    </label>
    <div class="cluster">
      @for (s of found.value() ?? []; track s.id) {
        <button
          type="button"
          class="pick"
          [class.on]="pickedStudent() === s.id"
          (click)="pickedStudent.set(s.id)"
        >
          {{ s.full_name }}
        </button>
      }
    </div>
  </div>

  <div class="card anim-rise" style="--i: 2">
    <label class="field"
      ><span>{{ 'planning.pick_term' | translate }}</span>
      <app-dropdown
        [options]="termOptions()"
        [value]="txt(pickedTerm())"
        (valueChange)="pickedTerm.set(num($event)); loadIntoForm()"
        ariaLabelKey="planning.pick_term"
      />
    </label>
    @if (plan.value()) {
      <button type="button" class="btn btn-ghost" (click)="loadIntoForm()">
        {{ 'planning.load_existing' | translate }}
      </button>
    }
  </div>

  @if (pickedStudent() !== null && pickedTerm() !== null) {
    <form class="card anim-rise" style="--i: 3" (ngSubmit)="submit()" autocomplete="off">
      <div class="segmented" role="group">
        <button
          type="button"
          [class.on]="form.controls.plan_mode.value === 'thumn'"
          (click)="form.controls.plan_mode.setValue('thumn')"
        >
          {{ 'mode.thumn' | translate }}
        </button>
        <button
          type="button"
          [class.on]="form.controls.plan_mode.value === 'surah'"
          (click)="form.controls.plan_mode.setValue('surah')"
        >
          {{ 'mode.surah' | translate }}
        </button>
      </div>

      @if (form.controls.plan_mode.value === 'thumn') {
        <label class="field"
          ><span>{{ 'planning.from_hizb' | translate }}</span>
          <input
            type="number"
            class="ltr-num"
            [formControl]="form.controls.start_hizb"
            min="1"
            max="60"
            step="0.5"
          />
        </label>
        <label class="field"
          ><span>{{ 'planning.to_hizb' | translate }}</span>
          <input
            type="number"
            class="ltr-num"
            [formControl]="form.controls.end_hizb"
            min="1"
            max="60"
            step="0.5"
          />
        </label>
      } @else {
        <label class="field"
          ><span>{{ 'planning.from_surah' | translate }}</span>
          <app-dropdown
            [formControl]="form.controls.plan_surah_from"
            [options]="surahOptions()"
            ariaLabelKey="planning.from_surah"
          />
        </label>
        <label class="field"
          ><span>{{ 'planning.from_ayah' | translate }}</span>
          <input
            type="number"
            class="ltr-num"
            [formControl]="form.controls.plan_ayah_from"
            min="1"
            [max]="ayahMax(form.controls.plan_surah_from.value)"
          />
        </label>
        <label class="field"
          ><span>{{ 'planning.to_surah' | translate }}</span>
          <app-dropdown
            [formControl]="form.controls.plan_surah_to"
            [options]="surahOptions()"
            ariaLabelKey="planning.to_surah"
          />
        </label>
        <label class="field"
          ><span>{{ 'planning.to_ayah' | translate }}</span>
          <input
            type="number"
            class="ltr-num"
            [formControl]="form.controls.plan_ayah_to"
            min="1"
            [max]="ayahMax(form.controls.plan_surah_to.value)"
          />
        </label>
      }

      <label class="field"
        ><span>{{ 'planning.goal' | translate }}</span
        ><input [formControl]="form.controls.goal_text"
      /></label>
      <label class="field"
        ><span>{{ 'planning.expected_week' | translate }}</span>
        <input
          type="number"
          class="ltr-num"
          [formControl]="form.controls.expected_hifz_week_thumn"
          min="0"
          step="0.5"
        />
      </label>
      <label class="field"
        ><span>{{ 'planning.expected_term' | translate }}</span>
        <input
          type="number"
          class="ltr-num"
          [formControl]="form.controls.expected_hifz_term_ahzab"
          min="0"
          step="0.5"
        />
      </label>
      <label class="field"
        ><span>{{ 'planning.khatm' | translate }}</span
        ><input [formControl]="form.controls.khatm_expected_at"
      /></label>

      @if (error()) {
        <p class="field-error">{{ error()! | translate }}</p>
      }

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [class.is-loading]="saving()"
        [disabled]="saving()"
      >
        @if (saving()) {
          <app-spinner />
        } @else {
          {{ 'planning.save_plan' | translate }}
        }
      </button>
    </form>
  }
</section>
