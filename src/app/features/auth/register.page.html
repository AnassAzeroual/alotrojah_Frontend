<main class="auth-stage">
  <app-auth-topbar />
  <section class="auth-card">
    <div class="auth-form-side">
      <h1 class="auth-title">{{ 'auth.create_account' | translate }}</h1>
      <p class="auth-sub">{{ 'auth.get_started' | translate }}</p>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="auth-input">
          <input
            type="text"
            formControlName="name"
            autocomplete="name"
            [placeholder]="'auth.name' | translate"
            [attr.aria-label]="'auth.name' | translate"
          />
        </div>

        <div class="auth-input">
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            dir="ltr"
            [placeholder]="'auth.email' | translate"
            [attr.aria-label]="'auth.email' | translate"
          />
        </div>

        <div class="auth-input">
          <input
            [type]="showPw() ? 'text' : 'password'"
            formControlName="password"
            autocomplete="new-password"
            dir="ltr"
            [placeholder]="'auth.password' | translate"
            [attr.aria-label]="'auth.password' | translate"
          />
          <button
            type="button"
            class="pw-eye"
            (click)="showPw.set(!showPw())"
            [attr.aria-label]="(showPw() ? 'auth.hide_password' : 'auth.show_password') | translate"
          >
            @if (showPw()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" /><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" /><path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" /><path d="M1 1l22 22" /></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" /><circle cx="12" cy="12" r="3" /></svg>
            }
          </button>
        </div>

        @if (failed()) {
          <p class="auth-error">{{ 'auth.invalid' | translate }}</p>
        }

        <button type="submit" class="auth-btn" [disabled]="form.invalid || loading()">
          @if (loading()) {
            <app-spinner />
          } @else {
            {{ 'auth.create_account' | translate }}
          }
        </button>
      </form>

      <p class="auth-switch">{{ 'auth.have_account' | translate }} <a routerLink="/login">{{ 'auth.login' | translate }}</a></p>

      <div class="auth-div">{{ 'auth.or_continue' | translate }}</div>

      <div class="social-row">
        <button type="button" class="social-btn" aria-label="Google">
          <svg viewBox="0 0 24 24"><path fill="#4285F4" d="M23.5 12.3c0-.9-.1-1.5-.3-2.3H12v4.3h6.5c-.1 1.1-.8 2.7-2.4 3.8l3.7 2.9c2.3-2.1 3.7-5.2 3.7-8.7z"/><path fill="#34A853" d="M12 24c3.2 0 5.9-1.1 7.9-2.9l-3.7-2.9c-1 .7-2.4 1.2-4.2 1.2-3.2 0-5.9-2.1-6.8-5.1L1.3 17.2C3.3 21.2 7.3 24 12 24z"/><path fill="#FBBC05" d="M5.2 14.3c-.2-.7-.4-1.5-.4-2.3s.1-1.6.4-2.3L1.3 6.8C.5 8.4 0 10.1 0 12s.5 3.6 1.3 5.2l3.9-2.9z"/><path fill="#EA4335" d="M12 4.7c1.8 0 3 .8 3.7 1.4l3.3-3.2C17.9 1.1 15.2 0 12 0 7.3 0 3.3 2.8 1.3 6.8l3.9 2.9c.9-2.9 3.6-5 6.8-5z"/></svg>
        </button>
        <button type="button" class="social-btn raised" aria-label="Apple">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.05 12.54c0-2.4 1.96-3.55 2.05-3.6-1.12-1.64-2.86-1.86-3.48-1.89-1.48-.15-2.89.87-3.64.87-.75 0-1.9-.85-3.13-.83-1.61.02-3.1.94-3.93 2.38-1.68 2.9-.43 7.2 1.2 9.56.8 1.15 1.75 2.45 3 2.4 1.2-.05 1.66-.78 3.12-.78s1.87.78 3.14.76c1.3-.02 2.12-1.17 2.91-2.33.92-1.34 1.3-2.64 1.32-2.7-.03-.02-2.54-.98-2.56-3.84zM14.16 4.06c.66-.8 1.1-1.9 1.1-3.01-1.07.04-2.36.71-3.12 1.51-.69.79-1.29 2.06-1.13 3.27 1.19.09 2.4-.6 3.15-1.77z"/></svg>
        </button>
        <button type="button" class="social-btn" aria-label="Facebook">
          <svg viewBox="0 0 24 24" fill="#1877F2"><path d="M24 12a12 12 0 1 0-13.9 11.9v-8.4h-3v-3.5h3V9.4c0-3 1.8-4.7 4.5-4.7 1.3 0 2.7.2 2.7.2v3h-1.5c-1.5 0-2 1-2 1.9V12h3.3l-.5 3.5h-2.8v8.4A12 12 0 0 0 24 12z"/></svg>
        </button>
      </div>
    </div>

    <div class="auth-art">
      <app-auth-art />
    </div>
  </section>
</main>
