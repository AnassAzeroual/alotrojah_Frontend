<main class="auth-stage" dir="ltr">
  <app-auth-topbar />
  <section class="auth-card">
    <div class="auth-art">
      <div class="hero-content">
        <p class="arabic-verse">وَرَتِّلِ الْقُرْآنَ تَرْتِيلًا</p>
      </div>

      <p class="hero-season">Season 2026–2027</p>
    </div>

    <div class="auth-form-side">
      <h1 class="auth-title" data-testid="auth-title">{{ 'auth.hello_again' | translate }}</h1>
      <p class="auth-sub">{{ 'auth.get_started' | translate }}</p>

      <form class="auth-form" [formGroup]="form" (ngSubmit)="submit()">
        <div class="auth-input">
          <input type="email" formControlName="email" autocomplete="username" dir="ltr" data-testid="auth-email"
            [placeholder]="'auth.email' | translate" [attr.aria-label]="'auth.email' | translate" />
        </div>

        <app-password-field [control]="form.controls.password" testId="auth-password" autocomplete="current-password" />

        <div class="auth-meta-row">
          <button type="button" class="link-quiet">{{ 'auth.recovery' | translate }}</button>
        </div>

        @if (failed()) {
        <p class="auth-error">{{ 'auth.invalid' | translate }}</p>
        }

        <button type="submit" class="auth-btn" data-testid="auth-submit" [disabled]="form.invalid || loading()">
          @if (loading()) {
          <app-spinner />
          } @else {
          {{ 'auth.login' | translate }}
          }
        </button>
      </form>

      <p class="auth-switch">
        {{ 'auth.no_account' | translate }}
        <a routerLink="/register">{{ 'auth.register' | translate }}</a>
      </p>
    </div>
  </section>
</main>
