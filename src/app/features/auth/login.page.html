<main class="login-page">
  <section class="login-hero anim-rise" aria-hidden="true">
    <span class="hero-mark">
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.6"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M12 3c-4 2.5-6 6-6 10a6 6 0 0 0 12 0c0-4-2-7.5-6-10z" />
        <path d="M12 8v7" />
        <path d="M9.5 11.5h5" />
      </svg>
    </span>
    <strong>{{ 'app.title' | translate }}</strong>
    <p class="quran-text">{{ 'auth.tagline' | translate }}</p>
    <p class="version">v{{ version }}</p>
  </section>

  <section class="login card anim-rise" style="--i: 1">
    <h1>{{ 'auth.login' | translate }}</h1>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label class="field">
        <span>{{ 'auth.email' | translate }}</span>
        <input
          type="email"
          formControlName="email"
          autocomplete="username"
          dir="ltr"
          placeholder=" "
        />
      </label>

      <label class="field pw">
        <span>{{ 'auth.password' | translate }}</span>
        <input
          [type]="showPw() ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password"
          dir="ltr"
          placeholder=" "
        />
        <button
          type="button"
          class="pw-toggle"
          (click)="showPw.set(!showPw())"
          [attr.aria-label]="(showPw() ? 'auth.hide_password' : 'auth.show_password') | translate"
          [attr.title]="(showPw() ? 'auth.hide_password' : 'auth.show_password') | translate"
        >
          @if (showPw()) {
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"
              />
              <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
              <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
              <path d="M1 1l22 22" />
            </svg>
          } @else {
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" />
              <circle cx="12" cy="12" r="3" />
            </svg>
          }
        </button>
      </label>

      @if (failed()) {
        <p class="field-error">{{ 'auth.invalid' | translate }}</p>
      }

      <button
        type="submit"
        class="btn btn-primary btn-block"
        [class.is-loading]="loading()"
        [disabled]="form.invalid || loading()"
      >
        @if (loading()) {
          <app-spinner />
        } @else {
          {{ 'auth.submit' | translate }}
        }
      </button>
    </form>
  </section>
</main>
