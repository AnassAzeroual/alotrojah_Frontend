<main class="login card">
  <h1>{{ 'auth.login' | translate }}</h1>
  <p class="muted">{{ 'app.subtitle' | translate }}</p>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      {{ 'auth.email' | translate }}
      <input type="email" formControlName="email" autocomplete="username" dir="ltr" />
    </label>

    <label>
      {{ 'auth.password' | translate }}
      <input type="password" formControlName="password" autocomplete="current-password" dir="ltr" />
    </label>

    @if (failed()) {
      <p class="error">{{ 'auth.invalid' | translate }}</p>
    }

    <button type="submit" [disabled]="form.invalid || loading()">
      @if (loading()) {
        <app-spinner />
      } @else {
        {{ 'auth.submit' | translate }}
      }
    </button>
  </form>
</main>
