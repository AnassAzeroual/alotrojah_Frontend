<section>
  <h1>{{ 'notif.title' | translate }}</h1>

  <form class="card" [formGroup]="form" (ngSubmit)="queue()">
    <label
      >{{ 'notif.phone' | translate }}
      <input formControlName="recipient_phone" inputmode="tel" dir="ltr" />
    </label>
    <label
      >{{ 'notif.message' | translate }}<textarea formControlName="message" rows="3"></textarea>
    </label>
    <button type="submit" class="primary" [disabled]="form.invalid || saving()">
      @if (saving()) {
        <app-spinner />
      } @else {
        {{ 'notif.queue' | translate }}
      }
    </button>
  </form>

  @if (items.isLoading()) {
    <app-spinner />
  } @else if ((items.value() ?? []).length === 0) {
    <app-empty-state />
  } @else {
    @for (m of items.value() ?? []; track m.id) {
      <div class="card line">
        <strong class="ltr-num">{{ m.recipient_phone }}</strong>
        <small class="muted">{{ m.status }}</small>
        <div class="row">
          <a [href]="m.wa_link" target="_blank" rel="noopener">{{ 'notif.send' | translate }}</a>
          @if (m.status === 'queued') {
            <button type="button" (click)="mark(m.id, 'sent')">
              {{ 'notif.sent' | translate }}
            </button>
            <button type="button" (click)="mark(m.id, 'failed')">
              {{ 'notif.failed' | translate }}
            </button>
          }
          <button
            type="button"
            [attr.aria-label]="'common.delete' | translate"
            (click)="remove(m.id)"
          >
            ×
          </button>
        </div>
      </div>
    }
  }
</section>
