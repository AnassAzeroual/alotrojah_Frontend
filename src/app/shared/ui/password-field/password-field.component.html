@if (labelKey() !== null) {
  <span class="pw-label"
    >{{ labelKey()! | translate }}
    @if (required()) {
      <span class="danger">*</span>
    }
  </span>
}
<div class="auth-input with-eye">
  <svg
    class="pw-lock"
    viewBox="0 0 24 24"
    fill="none"
    stroke="currentColor"
    stroke-width="2"
    stroke-linecap="round"
    stroke-linejoin="round"
    aria-hidden="true"
  >
    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
  </svg>
  <input
    [type]="show() ? 'text' : 'password'"
    [formControl]="control()"
    [autocomplete]="autocomplete()"
    dir="ltr"
    [attr.data-testid]="testId()"
    [placeholder]="textKey() | translate"
    [attr.aria-label]="textKey() | translate"
  />
  <button
    type="button"
    class="pw-eye"
    (click)="show.set(!show())"
    [attr.aria-label]="(show() ? 'auth.hide_password' : 'auth.show_password') | translate"
    [attr.data-testid]="testId() + '-visibility'"
  >
    @if (show()) {
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94" />
        <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19" />
        <path d="M14.12 14.12a3 3 0 1 1-4.24-4.24" />
        <path d="M1 1l22 22" />
      </svg>
    } @else {
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z" />
        <circle cx="12" cy="12" r="3" />
      </svg>
    }
  </button>
</div>
