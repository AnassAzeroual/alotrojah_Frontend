<!doctype html>
<html lang="ar" dir="rtl" data-theme="dark">

    <meta charset="utf-8" />
    <script>
      try {
        var t = localStorage.getItem('alotrojah_theme') || 'dark';
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>

    <meta name="theme-color" content="#0e7c5b" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&family=Readex+Pro:wght@400;500;600;700&display=swap"

    />
